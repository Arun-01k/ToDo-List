<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
</head>
<body>
    <div class="container">
        <h1>My Task Manager</h1>

        <div id="sidebar">
            <h4>My Projects</h4>

            <div id="daily-tasks-container">
                <p>Daily Tasks</p>
                <button>+ Add Task</button>

            </div>
            
            <button id="add-new-project-button">+ Project</button>

            <dialog id="add-project-dialog">
                <form method="dialog">
                    <label for="project-name">Project Name</label>
                    <input type="text" id="project-name" required autofocus>

                    <label for="project-description">Project Description</label>
                    <input type="text" id="project-description" placeholder="Project Description">

                    <button type="button" id="close-button">Close</button>
                    <button type="submit" id="project-submit-button">Add Project</button>
                </form>
            </dialog>
        </div>

        <div id="main-content"></div>
    </div>
</body>
</html>
